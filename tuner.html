<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Datacenter YouKyi · deux rendus</title>
  <link rel="icon" href="/assets/logo-youkyi.png">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; color: #e8edf4; background: #090b13; }
    body { margin: 0; height: 100svh; overflow: hidden; }
    button, select, input { font: inherit; }
    button { min-height: 44px; cursor: pointer; color: inherit; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #cbb5f5; outline-offset: 4px; }
    ::selection { background: #8568ad; color: white; }
    [hidden] { display: none !important; }
    #scene-canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 600ms ease; }
    #scene-canvas.ready { opacity: 1; }
    #veil, .vignette { position: fixed; inset: 0; pointer-events: none; }
    .vignette { background: radial-gradient(ellipse 90% 85% at 50% 50%, transparent 50%, rgba(3,5,9,.50)); }
    .compare { position: fixed; top: 24px; left: 28px; z-index: 3; width: min(570px, calc(100% - 172px)); }
    h1 { margin: 0 0 14px; font-size: 24px; line-height: 1.25; letter-spacing: -.02em; font-weight: 600; text-shadow: 0 2px 12px #000; }
    .modes { display: inline-flex; padding: 4px; gap: 4px; background: #121924; border: 1px solid #465264; border-radius: 12px; }
    .modes button { border: 0; padding: 10px 18px; background: transparent; border-radius: 8px; color: #c4cdda; font-size: 14px; }
    .modes button span { margin-right: 9px; font-size: 12px; color: #afbdce; }
    .modes button[aria-pressed=true] { background: #d9cee9; color: #211a2c; }
    .modes button[aria-pressed=true] span { color: #5b4775; }
    .modes button:hover:not([aria-pressed=true]) { background: #222d3d; }
    #render-description { margin: 12px 0 0; max-width: 49ch; font-size: 13px; line-height: 1.6; color: #c2ccda; text-shadow: 0 2px 8px #000; }
    .transport { position: fixed; left: 28px; bottom: 25px; z-index: 3; }
    .transport-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .transport button, #toggle-panel { padding: 8px 13px; border: 1px solid #465264; border-radius: 8px; background: #121924; font-size: 12px; }
    .transport button:hover, #toggle-panel:hover { background: #253044; }
    #performance { display: block; margin-top: 10px; font-size: 11px; color: #b8c5d5; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px #000; }
    #toggle-panel { position: fixed; right: 24px; top: 24px; z-index: 4; }
    #panel { position: fixed; right: 16px; top: 16px; bottom: 16px; z-index: 6; width: min(320px, calc(100% - 32px)); overflow-y: auto;
      background: #121924; border: 1px solid #465264; border-radius: 12px; padding: 18px; scrollbar-color: #536079 #121924; scrollbar-width: thin; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .panel-head strong { font-size: 16px; }
    #btn-collapse { border: 0; background: transparent; padding: 8px; color: #cbb5f5; font-size: 12px; }
    #controls h2 { margin: 24px 0 14px; font-size: 14px; font-weight: 600; color: #d8c9ef; }
    .row { margin-bottom: 14px; }
    .lab { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #c6d0de; }
    output { font-variant-numeric: tabular-nums; color: #d8c9ef; }
    input[type=range] { display: block; width: 100%; height: 24px; margin: 0; accent-color: #b19ad7; }
    .check { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 10px 0; font-size: 13px; }
    input[type=checkbox] { accent-color: #b19ad7; width: 17px; height: 17px; }
    select { width: 100%; min-height: 44px; border: 1px solid #465264; border-radius: 6px; padding: 8px; background: #1b2533; color: inherit; }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    .actions button { flex: 1; border: 1px solid #465264; border-radius: 6px; background: #253044; font-size: 12px; padding: 6px; }
    #toast { position: fixed; z-index: 10; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 12px 20px; border-radius: 8px; background: #d9cee9; color: #211a2c; font-size: 13px; }
    #loading-scene { position: fixed; top: 50%; width: 100%; text-align: center; color: #c6d0de; font-size: 14px; }
    @media (max-width: 640px) {
      .compare { left: 16px; top: 18px; width: calc(100% - 32px); }
      h1 { margin-bottom: 18px; font-size: 20px; padding-right: 90px; }
      .modes { display: flex; width: 100%; }
      .modes button { flex: 1; padding: 10px 8px; font-size: 12px; white-space: nowrap; }
      .modes button span { margin-right: 5px; }
      #render-description { max-width: 38ch; font-size: 12px; }
      #toggle-panel { top: 10px; right: 14px; padding: 6px 10px; }
      .transport { left: 16px; bottom: 18px; right: 16px; }
      #performance { font-size: 10px; line-height: 1.5; }
    }
    @media (prefers-reduced-motion: reduce) { #scene-canvas { transition: none; } }
  </style>
</head>
<body>
  <canvas id="scene-canvas" aria-hidden="true"></canvas>
  <div id="veil" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
  <main class="compare">
    <h1>Le datacenter YouKyi</h1>
    <div class="modes" role="group" aria-label="Choisir le rendu des baies">
      <button type="button" data-render="graphite" aria-pressed="true"><span>A</span>Façades graphite</button>
      <button type="button" data-render="hardware" aria-pressed="false"><span>B</span>Serveurs en volume</button>
    </div>
    <p id="render-description" aria-live="polite">Deux rendus, la même lumière et le même point de vue.</p>
  </main>
  <div class="transport">
    <div class="transport-controls"><button id="pause-scene" type="button" aria-pressed="false">Mettre en pause</button><button id="reset-view" type="button">Revenir au départ</button><button id="inspect-rack" type="button" aria-pressed="false">Voir une baie</button></div>
    <output id="performance" aria-live="off"></output>
  </div>
  <button id="toggle-panel" type="button" aria-controls="panel" aria-expanded="false">Réglages</button>
  <aside id="panel" aria-label="Réglages de la scène" hidden>
    <div class="panel-head"><strong>Réglages de la scène</strong><button id="btn-collapse" type="button">Fermer</button></div>
    <div id="controls"></div>
  </aside>
  <p id="loading-scene" role="status">Préparation du datacenter…</p>
  <div id="toast" role="status" hidden></div>
  <script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.js","three/addons/":"/assets/vendor/three/addons/"}}</script>
  <script type="module">
    window.DC_PANEL = true;
    if (new URLSearchParams(location.search).get('profile') === 'pro') {
      const response = await fetch('/config/pro.json');
      if (response.ok) window.DC_CONFIG = (await response.json()).dc;
    }
    window.addEventListener('dc:error', () => {
      document.getElementById('loading-scene').textContent = 'WebGL est indisponible. Ouvre cet aperçu dans un navigateur compatible avec la 3D.';
    });
    import('./assets/vendor/datacenter.js').catch(() => {
      document.getElementById('loading-scene').textContent = 'La scène n’a pas pu démarrer. Recharge la page pour réessayer.';
    });
  </script>
</body>
</html>
