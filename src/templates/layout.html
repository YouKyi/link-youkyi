<!DOCTYPE html>
<html lang="{{LANG}}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="{{THEME_COLOR}}">

    <!-- Aperçu lors du partage (Open Graph / Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{SITE_NAME}}">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE_ABS}}">
    <meta property="og:image:alt" content="{{AVATAR_ALT}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE_ABS}}">

    <link rel="icon" href="/assets/vendor/youkyi-brand/assets/logo/favicon-32.png" type="image/png">
{{POSTER_PRELOAD}}    <link rel="stylesheet" href="/assets/tailwind.css">
</head>
<body class="profile-page">

    <!-- Fond Datacenter 3D (Three.js auto-hébergé) + voile/vignette pour la lisibilité -->
    <div id="poster" class="scene-poster {{POSTER_CLASS}}" aria-hidden="true"></div>
    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div id="veil" class="scene-veil" aria-hidden="true"></div>
    <div class="scene-vignette" aria-hidden="true"></div>

    <!-- Contenu principal -->
    <main class="profile-main">

        <header class="profile-header">
            {{PROFILE_HEADING}}
            <p class="profile-bio">{{BIO}}</p>
        </header>

        <nav class="profile-links" aria-label="{{NAV_LABEL}}">
{{LINKS}}
        </nav>
    </main>

    <footer class="profile-footer">
        {{BRAND_SIGNATURE}}
        <p>{{FOOTER}}</p>
    </footer>

    <!-- Fond animé : config + moteur (importmap local => CSP 'self') -->
    <script>window.DC_CONFIG = {{DC_CONFIG}};</script>
    <script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.js","three/addons/":"/assets/vendor/three/addons/"}}</script>
    <script type="module">
        const motion = matchMedia('(prefers-reduced-motion: reduce)');
        function loadScene() {
            if (motion.matches) return;
            motion.removeEventListener('change', loadScene);
            const module = new URLSearchParams(location.search).get('background') === 'video' ? 'dc-video' : 'datacenter';
            import(`/assets/vendor/${module}.js`).catch(error => console.warn('[datacenter] Poster conservé.', error));
        }
        motion.addEventListener('change', loadScene);
        loadScene();
    </script>

    <!-- Easter egg console (coucou les curieux du DevTools) -->
    <script>
        (function () {
            var art = [
                "",
                "  █    █  ██████  ██  ██  ██  ██  █    █  ██████",
                "   █  █   ██  ██  ██  ██  ██ ██    █  █     ██   ",
                "    ██    ██  ██  ██  ██  ████      ██      ██   ",
                "    ██    ██  ██  ██  ██  ██ ██    ██       ██   ",
                "    ██    ██████  ██████  ██  ██   ██     ██████",
                ""
            ].join("\n");
            var ink = "color:#f2f0ec;";
            var fr = (navigator.language || '').toLowerCase().indexOf('fr') === 0;
            var tagline = fr ? "Administrateur système, réseaux & Cloud" : "Sysadmin · networks & Cloud";
            var invite = fr ? "Tu fouilles dans la console ? J'aime les curieux. Écris-moi : " : "Poking around the console? I like the curious ones. Drop me a line: ";
            console.log("%c" + art, ink + " font-family:monospace; font-size:12px; line-height:1.05;");
            console.log("%c" + tagline, ink + " font-weight:bold; font-size:13px;");
            console.log("%c" + invite + "%ceaster-egg@youkyi.net", ink + " font-size:13px;", "color:#ff8f5c; text-decoration:underline;");
        })();
    </script>
</body>
</html>
